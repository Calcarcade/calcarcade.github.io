/* Shown by GitHub Pages for any address that doesn't exist. Same look as the main page. */
:root {
  --bg: #0a0b18; --line: rgba(160, 172, 255, 0.12); --ink: #f4f5fc; --ink-soft: #b9bdd9; --ink-faint: #868bae;

}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; place-items: center; padding: 32px 20px;
  background-color: var(--bg);
  background-image:
    radial-gradient(800px 480px at 50% -80px, rgba(107, 92, 255, 0.24), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),

  background-size: auto, 32px 32px, 32px 32px;
  background-repeat: no-repeat, repeat, repeat;
  color: var(--ink); font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6;

}
main { max-width: 520px; }

p { margin: 0 auto 30px; max-width: 40ch; color: var(--ink-soft); }
.btn {

  font-family: "Jersey 10", ui-monospace, monospace; font-size: 1.65rem; letter-spacing: 0.03em; text-transform: uppercase; text-decoration: none;
  color: var(--key-ink); background: var(--yellow); box-shadow: 0 5px 0 var(--yellow-edge), 0 14px 26px -12px rgba(0, 0, 0, 0.7);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--yellow-edge); }
.blink { animation: blink 1.1s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hint { margin: 22px 0 0; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.76rem; color: var(--ink-faint); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
